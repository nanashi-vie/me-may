name: Publish Me May Backend

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'code/backend/**'
      - '.github/workflows/publish-backend.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: me_may_test
          POSTGRES_USER: memay_ci
          POSTGRES_PASSWORD: ci_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U memay_ci -d me_may_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: code/backend
    env:
      TEST_DB_URL: jdbc:postgresql://localhost:5432/me_may_test
      DB_URL: jdbc:postgresql://localhost:5432/me_may_test
      DB_USER: memay_ci
      DB_PASSWORD: ci_test_only
      NEON_JDBC_URL: jdbc:postgresql://localhost:5432/me_may_test
      NEON_JDBC_URL_UNPOOLED: jdbc:postgresql://localhost:5432/me_may_test
      NEON_DB_USER: memay_ci
      NEON_DB_PASSWORD: ci_test_only
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: code/backend/pom.xml

      - name: Initialize test database with Flyway
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp flyway:migrate

      - name: Run backend tests
        run: ./mvnw -B -ntp test

  publish:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: ./code/backend
          file: ./code/backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/nanashi-vie/me-may-api:main
            ghcr.io/nanashi-vie/me-may-api:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/nanashi-vie/me-may
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: publish
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions: {}
    steps:
      - name: Trigger Dokploy deployment
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_APPLICATION_ID: ${{ secrets.DOKPLOY_APPLICATION_ID }}
        shell: bash
        run: |
          set -euo pipefail
          : "${DOKPLOY_URL:?Missing GitHub Actions secret DOKPLOY_URL}"
          : "${DOKPLOY_API_KEY:?Missing GitHub Actions secret DOKPLOY_API_KEY}"
          : "${DOKPLOY_APPLICATION_ID:?Missing GitHub Actions secret DOKPLOY_APPLICATION_ID}"
          payload=$(jq -nc --arg id "$DOKPLOY_APPLICATION_ID" '{applicationId: $id}')
          status=$(curl --silent --show-error --fail --output /dev/null \
            --write-out '%{http_code}' --connect-timeout 10 --max-time 60 \
            --proto '=https' --request POST \
            "${DOKPLOY_URL%/}/api/application.deploy" \
            --header 'Accept: application/json' \
            --header 'Content-Type: application/json' \
            --header "x-api-key: $DOKPLOY_API_KEY" \
            --data "$payload")
          case "$status" in
            2??) echo 'Dokploy accepted the deployment request; check deployment logs for completion.' ;;
            *) echo "::error::Dokploy returned HTTP $status; deployment request was not accepted."; exit 1 ;;
          esac
