
name: Publish Me May Backend

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: ./code/backend
          file: ./code/backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/nanashi-vie/me-may-api:main
            ghcr.io/nanashi-vie/me-may-api:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/nanashi-vie/me-may
