<main class="login-page">
  <a class="brand" routerLink="/">Mẹ Mây</a>
  <section class="login-panel">
    <p class="eyebrow">Dành cho chủ tiệm và nhân viên</p>
    <h1>Đăng nhập quản trị</h1>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <fieldset [disabled]="loading()">
        <legend class="sr-only">Thông tin đăng nhập</legend>
        <label class="admin-field" for="email">
          <span class="field-label">Email</span>
          <input
            id="email"
            type="email"
            formControlName="email"
            autocomplete="username"
            required
          />
        </label>
        <label class="admin-field" for="password">
          <span class="field-label">Mật khẩu</span>
          <input
            id="password"
            type="password"
            formControlName="password"
            autocomplete="current-password"
            required
          />
        </label>
        <button type="submit" [disabled]="form.invalid || loading()">
          {{ loading() ? 'Đang đăng nhập…' : 'Đăng nhập' }}
        </button>
      </fieldset>
      @if (error()) {
        <p class="error" role="alert">{{ error() }}</p>
      }
    </form>
  </section>
  <a routerLink="/">Về trang chủ</a>
</main>
