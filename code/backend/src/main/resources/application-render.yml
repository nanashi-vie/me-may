spring:
  datasource:
    url: ${NEON_JDBC_URL}
    username: ${NEON_DB_USER}
    password: ${NEON_DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
      connection-timeout: 30000
  flyway:
    url: ${NEON_JDBC_URL_UNPOOLED}
    user: ${NEON_DB_USER}
    password: ${NEON_DB_PASSWORD}
    schemas: public
    default-schema: public
    clean-disabled: true
    baseline-on-migrate: false
server:
  address: 0.0.0.0
  port: ${PORT:8080}
memay:
  media:
    namespace: ${CLOUDINARY_NAMESPACE:memay/online-test}
  bootstrap:
    enabled: ${BOOTSTRAP_OWNER_ENABLED:false}
    email: ${BOOTSTRAP_OWNER_EMAIL:}
    password: ${BOOTSTRAP_OWNER_PASSWORD:}
