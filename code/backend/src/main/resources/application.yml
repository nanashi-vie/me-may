spring:
  application:
    name: me-may-api
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        name: MEMAYSESSION
        http-only: true
        secure: true
        same-site: lax
        path: /api
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
memay:
  bootstrap:
    enabled: false
